<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="fonts/mukta.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:2560px;height:1440px;overflow:hidden;font-family:'Mukta',sans-serif}
#bg{position:absolute;inset:0;background:radial-gradient(ellipse 70% 60% at 50% 50%,#7A3384 0%,#5C2664 45%,#34123F 100%)}
canvas{position:absolute;inset:0}
.ring{position:absolute;border-radius:50%;border:2px solid rgba(231,199,122,.18)}
/* decorative covers outside safe zone */
.dc{position:absolute;border-radius:12px;overflow:hidden;box-shadow:0 30px 60px rgba(10,0,20,.5);opacity:.55}
.dc img{width:100%;height:100%;display:block}
/* safe area 1546x423 centred: x 507..2053, y 508..931 */
#bar{position:absolute;left:487px;top:498px;width:1586px;height:444px;border-radius:44px;
 background:linear-gradient(100deg,rgba(59,23,71,.96) 0%,rgba(92,38,100,.96) 45%,rgba(122,51,132,.96) 100%);
 box-shadow:0 40px 90px rgba(10,0,20,.55);border:3px solid rgba(231,199,122,.4);overflow:hidden}
#bar .shine{position:absolute;top:-30%;left:900px;width:300px;height:160%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.10),transparent);transform:skewX(-20deg)}
#bar .line{position:absolute;left:0;bottom:0;height:8px;width:100%;background:linear-gradient(90deg,#E7C77A,#F6E3B0 60%,rgba(231,199,122,.2))}
#logo{position:absolute;left:530px;top:542px;width:356px;height:356px;border-radius:84px;overflow:hidden;box-shadow:0 20px 50px rgba(0,0,0,.45)}
#logo img{width:100%;height:100%}
#txt{position:absolute;left:930px;top:528px;width:760px;color:#FFF6E8}
.k{font-size:38px;font-weight:600;color:#E7C77A}
.h{font-size:92px;font-weight:800;line-height:1.02;margin-top:6px;white-space:nowrap}
.h .g{color:#E7C77A}
.s{font-size:50px;font-weight:700;margin-top:4px;white-space:nowrap;display:flex;align-items:center;gap:14px}
.s .g{color:#E7C77A}
.wave{display:inline-flex;gap:6px;align-items:center;height:46px;margin-left:6px}
.wave i{display:block;width:7px;border-radius:4px;background:#E7C77A}
#pill{display:inline-flex;align-items:center;gap:16px;background:#FFF8EE;border-radius:50px;padding:6px 36px 12px 22px;color:#5C2664;font-size:54px;font-weight:800;margin-top:12px;box-shadow:0 12px 30px rgba(0,0,0,.3)}
#pill .tld{color:#6C4EAE}
.cover{position:absolute;width:140px;height:211px;border-radius:10px;overflow:hidden;box-shadow:0 16px 36px rgba(0,0,0,.45)}
.cover img{width:100%;height:100%;display:block}
#guide{position:absolute;left:507px;top:508px;width:1546px;height:423px;border:3px dashed #0f0;display:none}
body.guide #guide{display:block}
</style></head>
<body>
<div id="bg"></div>
<canvas id="pc" width="2560" height="1440"></canvas>
<div id="rings"></div>
<div id="dcs"></div>
<div id="bar"><div class="shine"></div><div class="line"></div></div>
<div id="logo"><img src="a/logo_sq.png"></div>
<div id="txt">
 <div class="k">हिंदी किताबें • सारांश • उपन्यास • कहानियाँ • ऑडियो</div>
 <div class="h"><span class="g">1000+</span> हिंदी किताबें</div>
 <div class="s">
  <svg width="62" height="46" viewBox="0 0 120 90" fill="none" stroke="#E7C77A" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"><path d="M60 18 C45 8 22 8 6 14 V80 C22 74 45 74 60 84 C75 74 98 74 114 80 V14 C98 8 75 8 60 18 Z M60 18 V84"/></svg>
  पढ़िए भी, <span class="g">सुनिए भी</span><span class="wave" id="wave"></span></div>
 <div id="pill"><svg width="56" height="56" viewBox="0 0 70 70" fill="none" stroke="#6C4EAE" stroke-width="6"><circle cx="35" cy="35" r="29"/><ellipse cx="35" cy="35" rx="13" ry="29"/><path d="M6 35 H64"/></svg><span>pustika<span class="tld">.co.in</span></span></div>
</div>
<div id="covers"></div>
<div id="guide"></div>
<script>
let s=5;const R=()=>{s=(s*16807)%2147483647;return (s-1)/2147483646};
const c=document.getElementById('pc').getContext('2d');
for(let i=0;i<260;i++){const x=R()*2560,y=R()*1440,r=1+R()*4;c.globalAlpha=.15+R()*.55;c.fillStyle='#E7C77A';c.beginPath();c.arc(x,y,r,0,6.283);c.fill()}
// rings behind logo
[500,800,1150,1550].forEach(d=>{const e=document.createElement('div');e.className='ring';Object.assign(e.style,{width:d+'px',height:d+'px',left:(708-d/2)+'px',top:(720-d/2)+'px'});document.getElementById('rings').appendChild(e)});
// wave
const hs=[14,30,22,40,18,34,26,12,28];hs.forEach(h=>{const i=document.createElement('i');i.style.height=h+'px';document.getElementById('wave').appendChild(i)});
// covers fanned on right inside safe area
const C=['c_chanakya','c_dhamma','c_randomwalk','c_tidy'];
C.forEach((n,i)=>{const d=document.createElement('div');d.className='cover';d.innerHTML=`<img src="a/${n}.png">`;
 Object.assign(d.style,{left:(1665+i*72)+'px',top:(612+Math.abs(i-1.5)*14)+'px',transform:`rotate(${(i-1.5)*7}deg)`,zIndex:i});document.getElementById('covers').appendChild(d)});
// decorative covers outside safe area (desktop / TV only)
const D=[['c_atomic',90,140,190,-10],['c_analects',300,1060,170,8],['c_tidy',2290,120,200,9],['c_chanakya',2120,1050,190,-7],['c_dhamma',60,760,180,6],['c_randomwalk',2340,640,180,-6],['c_chanakya',820,60,150,5],['c_analects',1650,1180,150,-5],['c_atomic',1520,40,150,-8],['c_dhamma',1040,1170,150,7]];
D.forEach(([n,x,y,w,r])=>{const d=document.createElement('div');d.className='dc';d.innerHTML=`<img src="a/${n}.png">`;
 Object.assign(d.style,{left:x+'px',top:y+'px',width:w+'px',height:(w*1.5)+'px',transform:`rotate(${r}deg)`});document.getElementById('dcs').appendChild(d)});
</script></body></html>
