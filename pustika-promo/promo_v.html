<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="fonts/mukta.css">
<style>
:root{--purple:#5C2664;--deep:#3B1747;--violet:#6C4EAE;--cream:#F3ECDC;--ink:#2A2313;--gold:#E7C77A;--chip:#EFE4CF}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:var(--purple);font-family:'Mukta',sans-serif}
.abs{position:absolute}
#stage{position:absolute;inset:0;overflow:hidden}
#purpleBg{position:absolute;inset:0;background:radial-gradient(circle at 50% 45%,#7A3384 0%,#5C2664 45%,#34123F 100%)}
#creamBg{position:absolute;inset:0;background:radial-gradient(circle at 50% 40%,#FBF6EC 0%,#F3ECDC 55%,#E9DEC6 100%)}
#purple2{position:absolute;inset:0;background:radial-gradient(circle at 50% 40%,#7A3384 0%,#5C2664 50%,#2E0F38 100%)}
canvas{position:absolute;inset:0}
.ring{position:absolute;left:540px;top:900px;border-radius:50%;border:2px solid rgba(231,199,122,.5)}
#logo{position:absolute;left:340px;top:700px;width:400px;height:400px;border-radius:96px;overflow:hidden;box-shadow:0 40px 90px rgba(20,0,30,.55)}
#logo img{width:100%;height:100%;display:block}
#shine{position:absolute;top:-20%;width:40%;height:140%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.45),transparent);transform:skewX(-20deg)}
#tag1{left:0;width:1920px;top:770px;text-align:center;color:#F3E3E6;font-size:44px;font-weight:600;letter-spacing:2px}
#tag1 span{display:inline-block}
.dot{color:var(--gold);margin:0 18px}
/* scene 2 */
#count{left:0;width:1080px;top:600px;text-align:center;font-weight:800;font-size:280px;line-height:1;color:var(--purple);
  background:linear-gradient(180deg,#7B3B8C,#4A1A55);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
#countLbl{left:0;width:1080px;top:920px;text-align:center;font-size:96px;font-weight:700;color:var(--ink)}
#countSub{left:0;width:1080px;top:1080px;text-align:center;font-size:38px;font-weight:600;color:#8A7A5C;letter-spacing:6px}
#underline{left:340px;top:1052px;height:8px;width:400px;border-radius:4px;background:var(--violet);transform-origin:left center}
.cover{position:absolute;border-radius:10px;box-shadow:0 24px 50px rgba(60,30,20,.35);overflow:hidden}
.cover img{width:100%;height:100%;display:block}
/* phone */
#phoneWrap{position:absolute;left:0;top:0;width:1080px;height:1920px;perspective:1800px;transform:scale(1.22);transform-origin:540px 1060px}
#phone{position:absolute;width:428px;height:841px;left:326px;top:640px;border-radius:58px;background:#16111A;padding:14px;
  box-shadow:0 60px 120px rgba(40,10,50,.45),inset 0 0 0 2px #3a3140}
#screen{position:relative;width:400px;height:813px;border-radius:46px;overflow:hidden;background:#F4EDDD}
#status{position:absolute;left:0;top:0;width:400px;height:40px;background:#F4EDDD;z-index:3;font-size:17px;font-weight:700;color:#222;padding:10px 30px}
#status .r{position:absolute;right:28px;top:13px;display:flex;gap:6px;align-items:center}
#notch{position:absolute;left:182px;top:12px;width:16px;height:16px;border-radius:50%;background:#111;z-index:4}
#viewport{position:absolute;left:0;top:40px;width:400px;height:700px;overflow:hidden}
#long{position:absolute;left:0;top:0;width:400px}
#stripBox{position:absolute;left:0;width:400px;height:310px;overflow:hidden}
#strip{position:absolute;left:0;top:0;width:566px;height:310px}
#tabbar{position:absolute;left:0;top:740px;width:400px;height:73px;z-index:3}
#touch{position:absolute;width:56px;height:56px;border-radius:50%;background:rgba(108,78,174,.28);border:3px solid rgba(255,255,255,.8);z-index:5;left:0;top:0}
#player{position:absolute;left:12px;width:376px;height:66px;top:668px;border-radius:18px;background:linear-gradient(90deg,#4A1E57,#6C2F78);z-index:4;
  display:flex;align-items:center;padding:0 12px;gap:12px;color:#fff;box-shadow:0 10px 24px rgba(40,10,50,.35)}
#player img{width:40px;height:52px;border-radius:5px}
#player .t{flex:1;font-size:19px;font-weight:700;line-height:1.1}
#player .t small{display:block;font-size:14px;font-weight:600;opacity:.75}
#player .pb{position:absolute;left:12px;right:12px;bottom:6px;height:3px;background:rgba(255,255,255,.25);border-radius:2px}
#player .pb i{display:block;height:100%;width:30%;background:var(--gold);border-radius:2px}
.pbtn{width:42px;height:42px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center}
/* cards */
.card{position:absolute;width:420px;padding:36px 38px 34px;border-radius:36px;background:#FFFBF3;box-shadow:0 30px 70px rgba(80,50,30,.18)}
.card h2{font-size:74px;font-weight:800;color:var(--purple);line-height:1.05;margin-top:14px}
.card p{font-size:30px;font-weight:600;color:#8A7A5C;margin-top:4px}
.wave{display:flex;gap:7px;align-items:center;height:70px;margin-top:6px}
.wave i{display:block;width:8px;border-radius:4px;background:var(--violet)}
/* chips */
#topicHead{left:150px;top:200px;font-size:84px;font-weight:800;color:var(--ink)}
#topicSub{left:154px;top:315px;font-size:34px;font-weight:600;color:#8A7A5C}
.chip{position:absolute;height:92px;padding:0 34px;border-radius:46px;background:#EDE1C9;display:flex;align-items:center;gap:16px;font-size:40px;font-weight:700;color:var(--ink);box-shadow:0 14px 30px rgba(90,60,30,.14);white-space:nowrap}
.chip b{color:var(--violet);font-weight:800}
.chip svg{width:40px;height:40px}
/* outro */
#oLogo{left:410px;top:500px;width:260px;height:260px;border-radius:54px;overflow:hidden;box-shadow:0 30px 70px rgba(10,0,20,.5)}
#oLogo img{width:100%;height:100%}
#pill{left:90px;top:850px;width:900px;height:140px;border-radius:70px;background:#FFF8EE;box-shadow:0 30px 80px rgba(10,0,20,.45);display:flex;align-items:center;padding:0 56px;gap:28px}
#url{font-size:86px;font-weight:800;color:var(--purple);letter-spacing:1px;white-space:nowrap}
#url .tld{color:var(--violet)}
#caret{display:inline-block;width:6px;height:80px;background:var(--violet);vertical-align:middle;margin-left:6px;border-radius:3px}
#oTag{left:40px;width:1000px;top:1060px;text-align:center;font-size:56px;line-height:1.25;font-weight:700;color:#F6E9EC}
#oTag2{left:0;width:1080px;top:1240px;text-align:center;font-size:30px;font-weight:600;color:var(--gold);letter-spacing:8px}
/* subtitles */
#sub{position:absolute;left:50%;top:1640px;font-size:46px !important;transform:translateX(-50%);padding:10px 34px 12px;border-radius:30px;background:rgba(32,18,36,.72);color:#FFF6E8;font-size:38px;font-weight:600;white-space:nowrap;z-index:50}
#vign{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 60%,rgba(0,0,0,.18) 100%);z-index:40}
</style></head>
<body><div id="stage">
 <div id="purpleBg"></div>
 <canvas id="pc" width="1080" height="1920"></canvas>
 <!-- scene 1 -->
 <div id="s1">
  <div class="ring" id="r1"></div><div class="ring" id="r2"></div><div class="ring" id="r3"></div>
  <div id="logo"><img src="a/logo_sq.png"><div id="shine"></div></div>
  <div id="tag1" class="abs"><span>हिंदी किताबें</span><span class="dot">•</span><span>सारांश</span><span class="dot">•</span><span>कहानियाँ</span></div>
 </div>
 <!-- cream world -->
 <div id="cream">
  <div id="creamBg"></div>
  <canvas id="cc" width="1080" height="1920"></canvas>
  <div id="s2">
   <div id="count" class="abs">0</div>
   <div id="underline" class="abs"></div>
   <div id="countLbl" class="abs">हिंदी किताबें</div>
   <div id="countSub" class="abs">पढ़ें • सुनें • सीखें</div>
  </div>
  <div id="covers"></div>
  <!-- scene 3/4 -->
  <div id="cardRead" class="card">
   <svg width="120" height="90" viewBox="0 0 120 90" fill="none" stroke="#6C4EAE" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <path class="draw" d="M60 18 C45 8 22 8 6 14 V80 C22 74 45 74 60 84 C75 74 98 74 114 80 V14 C98 8 75 8 60 18 Z"/>
    <path class="draw" d="M60 18 V84"/>
    <path class="draw l" d="M18 30 H48"/><path class="draw l" d="M18 44 H48"/><path class="draw l" d="M18 58 H42"/>
    <path class="draw l" d="M72 30 H102"/><path class="draw l" d="M72 44 H102"/><path class="draw l" d="M72 58 H96"/>
   </svg>
   <h2>पढ़िए भी</h2><p>सरल हिंदी सारांश</p>
  </div>
  <div id="cardListen" class="card">
   <svg width="110" height="90" viewBox="0 0 110 90" fill="none" stroke="#6C4EAE" stroke-width="6" stroke-linecap="round">
    <path class="draw2" d="M14 62 V50 C14 24 32 8 55 8 C78 8 96 24 96 50 V62"/>
    <rect class="draw2" x="8" y="54" width="20" height="32" rx="8"/><rect class="draw2" x="82" y="54" width="20" height="32" rx="8"/>
   </svg>
   <h2>सुनिए भी</h2>
   <div class="wave" id="wave"></div>
  </div>
  <div id="topicHead" class="abs">हर विषय, एक जगह</div>
  <div id="topicSub" class="abs">सारांश, कहानियाँ, उपन्यास और भी बहुत कुछ</div>
  <div id="chips"></div>
  <div id="phoneWrap"><div id="phone"><div id="screen">
   <div id="status">9:41<div class="r">
    <svg width="20" height="14" viewBox="0 0 20 14"><rect x="0" y="9" width="3" height="5" fill="#222"/><rect x="5" y="6" width="3" height="8" fill="#222"/><rect x="10" y="3" width="3" height="11" fill="#222"/><rect x="15" y="0" width="3" height="14" fill="#222"/></svg>
    <svg width="28" height="14" viewBox="0 0 28 14"><rect x="1" y="1" width="23" height="12" rx="3" fill="none" stroke="#222" stroke-width="1.6"/><rect x="3" y="3" width="15" height="8" rx="1.5" fill="#222"/><rect x="25" y="5" width="2" height="4" fill="#222"/></svg></div></div>
   <div id="notch"></div>
   <div id="viewport"><div id="scroller">
     <img id="long" src="a/screen_long.png">
     <div id="stripBox"><img id="strip" src="a/strip.png"></div>
   </div></div>
   <div id="player"><img src="a/c_chanakya.png"><div class="t">चाणक्य नीति<small>ऑडियो • 18 min</small></div>
     <div class="pbtn"><svg width="18" height="20" viewBox="0 0 18 20"><rect x="1" y="1" width="5" height="18" rx="1.5" fill="#5C2664"/><rect x="11" y="1" width="5" height="18" rx="1.5" fill="#5C2664"/></svg></div>
     <div class="pb"><i id="pbi"></i></div></div>
   <img id="tabbar" src="a/tabbar.png">
   <div id="touch"></div>
  </div></div></div>
 </div>
 <!-- outro -->
 <div id="outro">
  <div id="purple2"></div>
  <canvas id="oc" width="1080" height="1920"></canvas>
  <div id="oLogo" class="abs"><img src="a/logo_sq.png"></div>
  <div id="pill" class="abs">
   <svg width="70" height="70" viewBox="0 0 70 70" fill="none" stroke="#6C4EAE" stroke-width="5"><circle cx="35" cy="35" r="29"/><ellipse cx="35" cy="35" rx="13" ry="29"/><path d="M6 35 H64 M10 20 H60 M10 50 H60"/></svg>
   <div id="url"></div>
  </div>
  <div id="oTag" class="abs">1000+ हिंदी किताबें — पढ़िए भी, सुनिए भी</div>
  <div id="oTag2" class="abs">आज ही शुरू करें</div>
  <div id="oCovers"></div>
 </div>
 <div id="vign"></div>
 <div id="sub"></div>
</div>
<script>
const $=id=>document.getElementById(id);
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const P=(t,a,b)=>clamp((t-a)/(b-a));
const lerp=(a,b,k)=>a+(b-a)*k;
const eOut=k=>1-Math.pow(1-k,3);
const eIO=k=>k<.5?4*k*k*k:1-Math.pow(-2*k+2,3)/2;
const eBack=k=>{const c1=1.7,c3=c1+1;return 1+c3*Math.pow(k-1,3)+c1*Math.pow(k-1,2)};
const eEl=k=>k===0?0:k===1?1:Math.pow(2,-10*k)*Math.sin((k*10-.75)*(2*Math.PI)/3)+1;
function rnd(s){return()=>{s=(s*16807)%2147483647;return (s-1)/2147483646}}
const R=rnd(7);const parts=[...Array(90)].map(()=>({x:R()*1080,y:R()*1920,r:1+R()*3.5,s:12+R()*40,p:R()*6.28,a:.25+R()*.6}));
function drawParticles(cv,t,col,alpha){const c=cv.getContext('2d');c.clearRect(0,0,1080,1920);
 for(const q of parts){const y=((q.y-t*q.s)%2020+2020)%2020-50;const x=q.x+Math.sin(t*.7+q.p)*18;
  c.globalAlpha=alpha*q.a*(.6+.4*Math.sin(t*2+q.p));c.fillStyle=col;c.beginPath();c.arc(x,y,q.r,0,6.283);c.fill();}}

// covers for scene 2
const CV=[
 {src:'c_chanakya',w:240,h:365,x:70,y:150,r:-8,from:[-500,-400]},
 {src:'c_randomwalk',w:220,h:330,x:790,y:130,r:7,from:[1500,-400]},
 {src:'c_tidy',w:220,h:330,x:800,y:1300,r:-6,from:[1500,2300]},
 {src:'c_dhamma',w:230,h:346,x:60,y:1290,r:6,from:[-500,2300]},
 {src:'c_atomic',w:150,h:225,x:460,y:250,r:9,from:[460,-400]},
 {src:'c_analects',w:150,h:225,x:470,y:1440,r:-9,from:[470,2300]},
];
const covEls=CV.map(c=>{const d=document.createElement('div');d.className='cover';d.style.width=c.w+'px';d.style.height=c.h+'px';d.innerHTML=`<img src="a/${c.src}.png">`;$('covers').appendChild(d);return d});
// outro covers
const OC=['c_chanakya','c_randomwalk','c_tidy','c_dhamma','c_atomic','c_analects'];
const ocEls=OC.map((s,i)=>{const d=document.createElement('div');d.className='cover';d.style.width='150px';d.style.height='225px';d.innerHTML=`<img src="a/${s}.png">`;$('oCovers').appendChild(d);return d});
// waveform
const wv=[...Array(26)].map(()=>{const i=document.createElement('i');$('wave').appendChild(i);return i});
// chips
const ICON={
 doc:'<svg viewBox="0 0 24 24" fill="none" stroke="#B0548A" stroke-width="2"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></svg>',
 story:'<svg viewBox="0 0 24 24" fill="none" stroke="#3F7D6E" stroke-width="2"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8"/></svg>',
 face:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="#D9542F"/><circle cx="8.5" cy="10" r="2.2" fill="#F6D8A8"/><circle cx="15.5" cy="10" r="2.2" fill="#F6D8A8"/><path d="M8 15.5q4 3 8 0" stroke="#F6D8A8" stroke-width="1.8" fill="none"/></svg>',
 book:'<svg viewBox="0 0 24 24" fill="none" stroke="#6C4EAE" stroke-width="2"><path d="M12 6C9 4 5 4 2 5v14c3-1 7-1 10 1 3-2 7-2 10-1V5c-3-1-7-1-10 1zM12 6v14"/></svg>',
 search:'<svg viewBox="0 0 24 24" fill="none" stroke="#D9762F" stroke-width="2.2"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l5 5"/></svg>',
 leaf:'<svg viewBox="0 0 24 24" fill="none" stroke="#B0548A" stroke-width="2"><path d="M4 20C4 10 10 4 20 4c0 10-6 16-16 16zM4 20l9-9"/></svg>'};
const CH=[
 {t:'सारांश',n:'151',i:'doc',x:150,y:400},{t:'कहानियाँ',n:'32',i:'story',x:500,y:400},
 {t:'युवा कथा',n:'',i:'face',x:150,y:520},{t:'उपन्यास',n:'',i:'book',x:465,y:520},
 {t:'रहस्य और थ्रिलर',n:'',i:'search',x:150,y:640},{t:'स्व-विकास',n:'',i:'leaf',x:585,y:640}];
const chipEls=CH.map(c=>{const d=document.createElement('div');d.className='chip';d.innerHTML=ICON[c.i]+c.t+(c.n?` <b>${c.n}</b>`:'');$('chips').appendChild(d);return d});

function layoutChips(){[[0,1],[2,3],[4,5]].forEach(row=>{let x=150;row.forEach(i=>{CH[i].x=x;x+=chipEls[i].offsetWidth+28})})}
document.querySelectorAll('.draw,.draw2').forEach(p=>{const L=p.getTotalLength?p.getTotalLength():300;p.style.strokeDasharray=L;p.dataset.L=L});

const SUBS=[[0.5,2.06,'हज़ार से ज़्यादा हिंदी किताबें'],[2.08,3.08,'पढ़िए भी, सुनिए भी'],[3.1,4.45,'पुस्तिका डॉट को डॉट इन पर']];
const S=1/1.79;
const set=(el,css)=>Object.assign(el.style,css);
function render(t){
 if(!window._lc){layoutChips();window._lc=1}
 drawParticles($('pc'),t,'#E7C77A',1);
 // logo intro 0-0.8
 const l=P(t,0,.38), lk=eBack(l), out1=eIO(P(t,.42,.8));
 set($('logo'),{transform:`translateY(${(1-eOut(l))*50}px) scale(${lerp(.3,1,lk)*(1+out1*1.6)}) rotate(${(1-eOut(l))*-10}deg)`,opacity:clamp(l*4)*(1-out1)});
 set($('shine'),{left:`${lerp(-60,160,eIO(P(t,.15,.55)))}%`});
 ['r1','r2','r3'].forEach((id,i)=>{const k=P(t,.02+i*.12,.8+i*.12);const s=lerp(300,1500,eOut(k));
  set($(id),{width:s+'px',height:s+'px',marginLeft:-s/2+'px',marginTop:-s/2+'px',opacity:(1-k)*.9*(k>0?1:0)})});
 $('tag1').style.display='none';
 $('s1').style.display=t<0.85?'block':'none';
 // cream wipe
 const w=eIO(P(t,.42,.8));
 set($('cream'),{position:'absolute',inset:0,clipPath:`circle(${w*1250}px at 50% 48%)`,display:(t>.4&&t<3.45)?'block':'none'});
 drawParticles($('cc'),t+3,'#8E5FA8',.35);
 // counter 0.55-2.25
 const ck=eOut(P(t,.6,1.5)), n=Math.round(ck*1000);
 $('count').textContent=n>=1000?'1000+':n;
 const ex2=eIO(P(t,1.85,2.25));
 set($('count'),{opacity:P(t,.5,.7)*(1-ex2),transform:`translateY(${-ex2*160}px) scale(${lerp(.85,1,eOut(P(t,.5,.9)))*(1+.05*Math.sin(Math.PI*P(t,1.5,1.75)))*(1-ex2*.3)})`});
 set($('underline'),{transform:`scaleX(${eOut(P(t,1.45,1.7))})`,opacity:1-ex2});
 const lb=eOut(P(t,.7,1.05));
 set($('countLbl'),{opacity:lb*(1-ex2),transform:`translateY(${(1-lb)*40-ex2*120}px)`,clipPath:`inset(0 ${(1-lb)*50}% 0 ${(1-lb)*50}%)`});
 const sb=eOut(P(t,1.55,1.85));
 set($('countSub'),{opacity:sb*(1-ex2),transform:`translateY(${(1-sb)*20-ex2*100}px)`,letterSpacing:lerp(20,6,sb)+'px'});
 CV.forEach((c,i)=>{const k=eOut(P(t,.5+i*.08,1.0+i*.08)),ex=eIO(P(t,1.8+i*.03,2.2+i*.03));
  const fx=lerp(c.from[0],c.x,k),fy=lerp(c.from[1],c.y,k),ox=(c.x+c.w/2-540)*ex*1.4,oy=(c.y+c.h/2-960)*ex*1.4;
  const bob=Math.sin(t*3+i)*8,par=(t-1)*(i%2?14:-14);
  set(covEls[i],{left:0,top:0,transform:`translate(${fx+ox+par}px,${fy+oy+bob}px) rotate(${lerp(c.r*4,c.r,k)+Math.sin(t*2+i)*2}deg) scale(${1-ex*.3})`,opacity:k*(1-ex),display:t<2.3?'block':'none'})});
 $('s2').style.display=t<2.3?'block':'none';
 // phone 1.9-3.45
 const pin=eOut(P(t,1.9,2.4));
 const tiltY=lerp(-28,0,pin)+Math.sin(t*1.5)*2.5;
 set($('phone'),{transform:`translate(0px,${(1-pin)*900}px) rotateY(${tiltY}deg) rotateX(${(1-pin)*20}deg) scale(${1+.04*P(t,2.4,3.4)})`,display:t>1.85?'block':'none'});
 const sc=300*eIO(P(t,2.45,3.0));
 $('scroller').style.transform=`translateY(${-sc}px)`;
 set($('stripBox'),{top:(1924*S)+'px'});
 let tv=0,ty=0;if(t>=2.38&&t<=3.1){tv=Math.min(P(t,2.38,2.47),1-P(t,3.0,3.1));ty=lerp(560,250,eIO(P(t,2.45,3.0)))}
 set($('touch'),{opacity:tv*.95,transform:`translate(${230-28}px,${ty-28}px)`});
 const pl=eBack(P(t,2.7,3.0));
 set($('player'),{transform:`translateY(${(1-pl)*120}px)`,opacity:clamp(pl*2)});
 $('pbi').style.width=(20+P(t,2.7,3.4)*15)+'%';
 // cards
 const cr=eBack(P(t,2.05,2.4));
